<!DOCTYPE html>
<!--
  HAVOC · SEMANTIC GRAPH INSTRUMENT — graph index (rack)
  World: "The Instrument" (see visualizer.html contract). Machined panel, engraved Saira Condensed over B612 Mono,
  kind-law colours reserved for the graph itself. The index is a signal directory / patch bay, not a card grid.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAVOC Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=B612:wght@400;700&family=B612+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --panel:#0b0d0f; --panel-2:#0e1114; --face:#111417; --face-2:#161a1f;
      --bezel:#2a2f36; --bezel-hi:#3d4650; --groove:#04060a;
      --lum:#f2f5f2; --green:#39ff9a; --amber:#ffb000;
      --ink:#cbd4ce; --ink-dim:#95a19a; --ink-face:#e8ede9;
      --sans:'B612',system-ui,sans-serif; --mono:'B612 Mono',ui-monospace,monospace; --disp:'Saira Condensed',var(--sans);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{ min-height:100vh; overflow-x:hidden; background:var(--panel); color:var(--ink); font-family:var(--mono); font-size:13px;
      background-image:
        radial-gradient(120% 80% at 50% -10%, rgba(57,255,154,.04), transparent 55%),
        repeating-linear-gradient(0deg, rgba(255,255,255,.008) 0 1px, transparent 1px 3px),
        repeating-linear-gradient(90deg, rgba(0,0,0,.16) 0 1px, transparent 1px 4px);
    }
    .wrap{ max-width:1080px; margin:0 auto; padding:56px 28px 80px; }

    .mast{ display:flex; align-items:center; gap:14px; margin-bottom:8px; }
    .mark{ width:44px;height:44px;flex:none;display:grid;place-items:center;border:1px solid var(--bezel);border-radius:9px;
      background:radial-gradient(120% 120% at 50% 20%,var(--face-2),var(--face));box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 2px 6px rgba(0,0,0,.55); }
    .mark svg{ width:30px;height:30px; }
    .mast .name{ font-family:var(--disp);font-weight:800;letter-spacing:.32em;font-size:26px;color:var(--lum);line-height:1; }
    .mast .sub{ font-size:10px;letter-spacing:.26em;color:var(--ink-dim);margin-top:5px; }
    .lede{ max-width:640px; color:var(--ink-dim); font-family:var(--sans); font-size:14px; line-height:1.55; margin:14px 0 34px; }
    .lede b{ color:var(--ink-face); font-weight:400; }

    .bar{ display:flex; gap:14px; align-items:center; margin-bottom:34px; flex-wrap:wrap; }
    .search{ flex:1; min-width:280px; display:flex; align-items:center; gap:10px; background:var(--face); border:1px solid var(--bezel); border-radius:5px; padding:12px 15px; box-shadow:inset 0 1px 3px rgba(0,0,0,.6); }
    .search:focus-within{ border-color:var(--green); box-shadow:inset 0 1px 3px rgba(0,0,0,.6),0 0 0 1px rgba(57,255,154,.25); }
    .search svg{ width:16px;height:16px;color:var(--ink-dim);flex:none; }
    .search input{ flex:1; background:none;border:none;outline:none;color:var(--ink-face);font-family:var(--mono);font-size:13px; }
    .search input::placeholder{ color:var(--ink-dim); }
    .telem{ display:flex; align-items:baseline; gap:8px; background:var(--face); border:1px solid var(--bezel); border-radius:5px; padding:10px 16px; box-shadow:inset 0 1px 3px rgba(0,0,0,.5); }
    .telem .n{ font-family:var(--disp); font-weight:700; font-size:20px; color:var(--green); line-height:1; }
    .telem .l{ font-size:9px; letter-spacing:.14em; color:var(--ink-dim); }

    .group{ margin-bottom:34px; }
    .grp-title{ display:flex; align-items:center; gap:12px; font-family:var(--disp); font-weight:700; font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-dim); margin-bottom:14px; }
    .grp-title::after{ content:''; flex:1; height:1px; background:linear-gradient(90deg,var(--bezel),transparent); }

    /* rack rows — a signal directory, not a card grid */
    .rack{ display:flex; align-items:center; gap:16px; text-decoration:none; color:inherit; padding:16px 18px; margin-bottom:8px;
      background:linear-gradient(180deg,var(--panel-2),var(--panel)); border:1px solid var(--bezel); border-radius:6px;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.03); transition:.14s cubic-bezier(.16,1,.3,1); }
    .rack:hover{ background:var(--face); border-color:var(--bezel-hi); transform:translateX(3px); box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 6px 20px rgba(0,0,0,.4),-3px 0 0 var(--green); }
    .rk-lamp{ width:9px;height:9px;border-radius:50%;flex:none; background:var(--amber); box-shadow:0 0 8px currentColor; color:var(--amber); }
    .rk-lamp.fed{ background:var(--green); color:var(--green); }
    .rk-main{ flex:1; min-width:0; }
    .rk-name{ font-family:var(--disp); font-weight:600; font-size:18px; letter-spacing:.02em; color:var(--ink-face); line-height:1.15; }
    .rk-path{ font-size:10.5px; color:var(--ink-dim); font-family:var(--mono); margin-top:4px; word-break:break-all; }
    .rk-meter{ margin-top:9px; height:3px; max-width:340px; background:var(--groove); border-radius:2px; overflow:hidden; box-shadow:inset 0 0 0 1px rgba(0,0,0,.4); }
    .rk-meter span{ display:block; height:100%; background:linear-gradient(90deg, rgba(57,255,154,.4), var(--green)); }
    .rk-type{ flex:none; font-family:var(--disp); font-weight:700; font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-dim); border:1px solid var(--bezel); border-radius:3px; padding:3px 8px; }
    .rk-size{ flex:none; text-align:right; min-width:74px; }
    .rk-size b{ font-family:var(--disp); font-weight:700; font-size:19px; color:var(--ink-face); }
    .rk-size span{ font-size:9px; letter-spacing:.12em; color:var(--ink-dim); display:block; margin-top:1px; }
    .rk-go{ flex:none; font-family:var(--disp); font-weight:700; color:var(--ink-dim); font-size:18px; transition:.14s; }
    .rack:hover .rk-go{ color:var(--green); transform:translateX(3px); }

    .empty{ text-align:center; padding:64px 20px; color:var(--ink-dim); }
    .empty .h{ font-family:var(--disp); font-weight:700; font-size:16px; letter-spacing:.06em; color:var(--ink-face); margin-bottom:8px; }
    .empty code{ font-family:var(--mono); color:var(--green); }
    @media (max-width:640px){
      .wrap{ padding:40px 18px 60px; }
      .bar{ flex-direction:column; align-items:stretch; }
      .search{ min-width:0; }
      .telem{ align-self:flex-start; }
      .rk-type{ display:none; }
      .rack{ gap:12px; padding:14px; }
      .rk-size{ min-width:56px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="mast">
      <span class="mark">
        <svg viewBox="0 0 26 26" fill="none" aria-hidden="true">
          <circle cx="13" cy="13" r="10.5" stroke="#2f3841" stroke-width="1"/>
          <path d="M13 1.5v3M13 21.5v3M1.5 13h3M21.5 13h3" stroke="#39ff9a" stroke-width="1.3" stroke-linecap="round"/>
          <line x1="9" y1="10" x2="17" y2="9" stroke="#4a5560" stroke-width="1"/>
          <line x1="9" y1="10" x2="13" y2="17" stroke="#4a5560" stroke-width="1"/>
          <line x1="17" y1="9" x2="13" y2="17" stroke="#4a5560" stroke-width="1"/>
          <circle cx="9" cy="10" r="2.4" fill="#f2f5f2"/>
          <path d="M17 6.6l2.1 3.6h-4.2z" fill="#ffb000"/>
          <rect x="10.9" y="14.9" width="4.2" height="4.2" rx="1" fill="#39ff9a"/>
        </svg>
      </span>
      <div><div class="name">HAVOC</div><div class="sub">EXPLORER</div></div>
    </div>
    <p class="lede">A navigable, evidence-grounded map of how vulnerabilities work — <b>sources → capabilities → impacts → mitigations</b>, mined from real CVEs, CTF write-ups, audits and fuzzing. Select a graph to open the explorer; every node resolves to its primary evidence.</p>

    <div class="bar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Search graphs by name, category, or path…" aria-label="Search graphs">
      </div>
      <div class="telem"><span class="n" id="graphCount">0</span><span class="l">GRAPHS<br>DISCOVERED</span></div>
    </div>

    <div id="graphsContainer"></div>
  </div>

  <script>
    let allGraphs=[];
    function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function humanize(seg){ return String(seg||'').replace(/[_\-]+/g,' ').replace(/\b(v?\d+)\b/g,m=>m.toUpperCase()).replace(/\b\w/g,c=>c.toUpperCase()).trim(); }

    async function loadGraphs(){
      try{
        const res=await fetch('api/graphs.json'); if(!res.ok) throw new Error('HTTP '+res.status);
        allGraphs=await res.json(); renderGraphs(allGraphs);
      }catch(err){
        document.getElementById('graphsContainer').innerHTML=
          `<div class="empty"><div class="h">Signal lost — graph server unreachable</div>
           <div style="font-family:var(--sans)">Start <code>python3 server.py</code> and reload.</div></div>`;
      }
    }

    function renderGraphs(graphs){
      document.getElementById('graphCount').textContent=graphs.length;
      const c=document.getElementById('graphsContainer');
      if(graphs.length===0){ c.innerHTML=`<div class="empty"><div class="h">No graphs match that query.</div></div>`; return; }
      const maxSize=Math.max(...graphs.map(g=>g.size_mb||0), 0.01);
      const grouped={};
      graphs.forEach(g=>{ const k=g.category||'general'; (grouped[k]=grouped[k]||[]).push(g); });
      let html='';
      Object.keys(grouped).sort().forEach(cat=>{
        html+=`<div class="group"><div class="grp-title">${escapeHtml(humanize(cat))}</div>`;
        grouped[cat].forEach(g=>{
          const fed=g.type==='federation';
          const pct=Math.max(6, Math.round((g.size_mb||0)/maxSize*100));
          html+=`<a class="rack" href="visualizer.html?id=${g.id}">
            <span class="rk-lamp ${fed?'fed':''}" title="${fed?'Federation':'Legacy'} graph"></span>
            <div class="rk-main"><div class="rk-name">${escapeHtml(humanize(g.name.split('/').pop()))}</div><div class="rk-path">${escapeHtml(g.file)}</div>
              <div class="rk-meter" title="Relative size"><span style="width:${pct}%"></span></div></div>
            <span class="rk-type">${fed?'Federation':'Legacy'}</span>
            <div class="rk-size"><b>${g.size_mb}</b><span>MB</span></div>
            <span class="rk-go">▸</span>
          </a>`;
        });
        html+=`</div>`;
      });
      c.innerHTML=html;
    }

    document.getElementById('searchInput').addEventListener('input',e=>{
      const q=e.target.value.toLowerCase().trim();
      renderGraphs(allGraphs.filter(g=> g.name.toLowerCase().includes(q)||g.file.toLowerCase().includes(q)||(g.category||'').toLowerCase().includes(q)));
    });

    loadGraphs();
  </script>
</body>
</html>
